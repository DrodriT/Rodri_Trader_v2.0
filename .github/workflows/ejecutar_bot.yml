name: Test Conexion Velas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Normalizar el nombre de la imagen a minúsculas
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar bot dentro de la imagen ya construida
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            -v "$PWD/data:/app/data" \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            python test_conexion_velas.py

      - name: Marcar el directorio como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit y push de los resultados generados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "ℹ️ Sin cambios en data/, no se hace commit."
          else
            git commit -m "🤖 Actualiza resultados de indicadores [skip ci]"
            git push
          fi
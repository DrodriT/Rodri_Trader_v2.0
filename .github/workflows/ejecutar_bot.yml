name: Test Conexion Velas

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde un botón en GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Ejecutamos el job DENTRO de la imagen Docker ya publicada en GHCR.
    # No hay que instalar Python ni dependencias: la imagen ya las trae.
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Ejecutar script de velas
        run: python test_conexion_velas.py
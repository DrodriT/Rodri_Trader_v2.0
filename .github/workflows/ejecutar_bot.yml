name: Test Conexion Velas

on:
  workflow_dispatch:

# Todos los workflows que escriban en data/ deberían utilizar exactamente
# este mismo grupo para evitar modificaciones simultáneas sobre main.
concurrency:
  group: actualizacion-datos-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # Descargamos el historial completo porque posteriormente será
          # necesario ejecutar rebase contra la rama remota.
          fetch-depth: 0

      - name: Marcar el directorio como seguro para Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configurar usuario de GitHub Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sincronizar con la rama main
        run: |
          # Sincronizamos antes de generar los archivos para trabajar sobre
          # la versión más reciente disponible en el repositorio remoto.
          git fetch origin main
          git rebase origin/main

      - name: Normalizar el nombre de la imagen a minúsculas
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar bot dentro de la imagen ya construida
        run: |
          docker pull "ghcr.io/${{ env.IMAGE_NAME }}:latest"

          docker run --rm \
            -v "$PWD/data:/app/data" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            python test_conexion_velas.py

      - name: Commit y push de los resultados generados
        shell: bash
        run: |
          set -e

          # Añadimos únicamente los archivos generados dentro de data/.
          git add data/

          # Si el bot no ha modificado ningún archivo, finalizamos el
          # workflow correctamente sin crear un commit vacío.
          if git diff --cached --quiet; then
            echo "ℹ️ Sin cambios en data/, no se realiza ningún commit."
            exit 0
          fi

          git commit -m "🤖 Actualiza resultados de indicadores [skip ci]"

          # El push podría ser rechazado si main cambia después de ejecutar
          # el bot. Reintentamos hasta cinco veces incorporando esos cambios.
          for intento in 1 2 3 4 5; do
            echo "ℹ️ Intento de publicación ${intento}/5..."

            if git push origin HEAD:main; then
              echo "✅ Push realizado correctamente."
              exit 0
            fi

            echo "⚠️ El remoto ha avanzado. Sincronizando con origin/main..."

            git fetch origin main

            # Durante un rebase:
            # - "ours" representa el contenido actual de origin/main.
            # - "theirs" representa el commit que estamos reaplicando.
            #
            # Puesto que data/ contiene resultados recién calculados,
            # conservamos la versión creada por esta ejecución cuando
            # ambos commits hayan modificado el mismo fragmento.
            if ! git rebase -X theirs origin/main; then
              echo "❌ El rebase no pudo resolverse automáticamente."

              # Dejamos el repositorio en un estado limpio antes de terminar.
              git rebase --abort || true
              exit 1
            fi
          done

          echo "❌ No se pudo publicar después de cinco intentos."
          exit 1
name: Test Conexion Velas

on:
  workflow_dispatch:

# Evita que dos ejecuciones de este workflow corran a la vez sobre el mismo repo.
# Si lanzas una nueva mientras otra sigue corriendo, esta espera en cola en vez
# de competir por el mismo 'main' y generar conflictos de push.
concurrency:
  group: ejecutar-bot-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Normalizar el nombre de la imagen a minúsculas
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar bot dentro de la imagen ya construida
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            python test_conexion_velas.py

      - name: Marcar el directorio como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit y push de los resultados generados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "ℹ️ Sin cambios en data/, no se hace commit."
            exit 0
          fi

          git commit -m "🤖 Actualiza resultados de indicadores [skip ci]"

          # Reintenta el push hasta 3 veces: si el remoto avanzó entre nuestro
          # commit y el push (otra ejecución concurrente, o un commit manual),
          # traemos esos cambios con rebase y reintentamos en vez de fallar.
          for intento in 1 2 3; do
            if git push; then
              echo "✅ Push realizado con éxito (intento $intento)."
              exit 0
            fi
            echo "⚠️ Push rechazado, sincronizando con el remoto (intento $intento)..."
            git pull --rebase origin main
          done

          echo "❌ No se pudo hacer push tras varios intentos."
          exit 1
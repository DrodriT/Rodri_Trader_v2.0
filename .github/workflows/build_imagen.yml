name: Construir y Publicar Imagen Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "requirements.txt"
      - "indicadores/**"
      - "config.py"
      - "test_conexion_velas.py"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Normalizar el nombre de la imagen a minúsculas
        # Docker/GHCR exigen que el nombre del repositorio sea en minúsculas.
        # github.repository puede contener mayúsculas (ej: "DrodriT/Rodri_Trader_v2.0"),
        # así que lo convertimos aquí y lo guardamos como variable de entorno reutilizable.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx (soporte de caché de capas)
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
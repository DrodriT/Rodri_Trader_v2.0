name: Construir y Publicar Imagen Docker

# Solo se dispara cuando cambian los archivos que afectan a la imagen,
# o manualmente si necesitas forzar una reconstrucción
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile/Dockerfile"
      - "Dockerfile/requirements.txt"
      - "indicadores/**"
      - "config.py"
      - "test_conexion_velas.py"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Necesario para poder publicar en GHCR

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx (soporte de caché de capas)
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max